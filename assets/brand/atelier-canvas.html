<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ateliê de marca • Felipe Modas</title>
<style>
:root{font:16px/1.45 system-ui,sans-serif;color:#202020;background:#faf8f1}*{box-sizing:border-box}body{max-width:950px;margin:0 auto;padding:clamp(18px,4vw,55px)}h1{font:normal clamp(32px,6vw,60px)/1.1 Georgia,serif;margin:0 0 28px}form{display:flex;gap:15px;align-items:end;flex-wrap:wrap}label{display:grid;gap:5px}select,input,button{font:inherit;border:1px solid #806e60;border-radius:2px;background:white;padding:8px;min-height:44px}button{background:#955a3a;color:white;padding:9px 18px;cursor:pointer}figure{display:grid;place-items:center;margin:24px 0;border:1px solid #d9c8b7;padding:6%;min-height:240px;background:white}figure.escuro{background:#202020}canvas{max-width:100%;height:auto}
</style></head><body><h1>Ateliê da marca</h1>
<form id="controles"><label>Peça<select id="modelo"><option value="logo">Assinatura horizontal</option><option value="wordmark">Nome</option><option value="compact">Assinatura compacta</option><option value="monogram">Monograma</option><option value="favicon">Favicon</option><option value="apple-touch-icon">Ícone de tela inicial</option><option value="aplicacoes">Aplicações</option><option value="exploracoes">Estudos de símbolo</option></select></label>
<label>Cor<select id="cor"><option value="#202020">Carvão</option><option value="#ffffff">Branco</option><option value="#000000">Preto</option></select></label><label>Largura em pixels<input id="largura" type="number" min="16" max="4800" step="1" value="1800" required></label><button>Exportar PNG</button></form>
<figure id="fundo"><canvas id="tela" aria-label="Prévia da composição escolhida"></canvas></figure>
<script id="desenho">

const iniciais = {
  "f": "M7 63.5 17.7 14.2Q18.8 9.1 14.3 7.4L15 5h37.5L49 16.5l-1.7-.2C47 10.6 43.5 8 35.3 8h-8.8l-5.2 23.9h7.1c5.4 0 8.1-1.6 10.2-6.4l1.6.3-3.4 16-1.8-.1c-.1-4.7-1.6-7.2-7.2-7.2h-7l-6.2 29Z",
  "m": "M21.7 63.5 30 41l2.8 5.6-6.5 16.9Zm8-42.3 8.2.2 9.6 24.4L65.2 18h5.9L60.8 63.5h-8.2l8.7-36.3L44.2 54.4h-2.3L30 23.7Z"
};
const propostas = [
  ["M4 67C18 40 14 5 55 4 34 11 22 27 19 45 32 33 44 29 57 30 34 39 23 50 16 67Z","M20 67Q31 44 65 36 43 49 32 67Z"],
  ["m4 64 13-58 19 50 28-50-13 58","m10 37 39-30H18M12 39l25-2"],
  [iniciais.f, iniciais.m]
];
const nome = "Felipe Modas";
const larguraNome = Object.values([...nome].map(c => c === " " ? 15 : letras[c].w)).reduce((a,b) => a+b, 0);
const quadros = {
  logo: [larguraNome + 90, 88],
  wordmark: [larguraNome + 3, 88],
  monogram: [70,65],
  compact: [235,126],
  favicon: [80,80],
  "apple-touch-icon": [80,80],
  aplicacoes: [940,450],
  exploracoes: [480,150]
};
function grupo(ctx,x,y,escala,desenhar) {
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(escala,escala);
  desenhar();
  ctx.restore();
}
function pintar(ctx, traçado) { ctx.fill(new Path2D(traçado)); }
function escrever(ctx) {
  let x = 0;
  for (const letra of nome) {
    if (letra === " ") { x += 15; continue; }
    grupo(ctx,x,0,1,()=>pintar(ctx,letras[letra].d));
    x += letras[letra].w;
  }
}
function simbolo(ctx) {
  pintar(ctx,iniciais.f);
  pintar(ctx,iniciais.m);
}
function horizontal(ctx) {
  grupo(ctx,-4,0,1.05,()=>simbolo(ctx));
  grupo(ctx,85,0,1,()=>escrever(ctx));
}
function amostras(ctx) {
  ctx.fillStyle = "#faf8f1"; ctx.fillRect(0,0,940,450);
  ctx.fillStyle = "#202020"; ctx.fillRect(0,245,650,205);
  ctx.fillStyle = "#955a3a"; ctx.fillRect(650,0,290,450);
  ctx.fillStyle = "#202020"; grupo(ctx,67,85,.96,()=>horizontal(ctx));
  ctx.fillStyle = "#ffffff"; grupo(ctx,128,316,.74,()=>horizontal(ctx));
  grupo(ctx,786,235,1,()=>{
    ctx.rotate(-Math.PI/18);
    const fio = new Path2D("M0-244v142");
    ctx.strokeStyle="#202020"; ctx.lineWidth=3; ctx.stroke(fio);
    ctx.fillStyle="#e4d7c8"; pintar(ctx,"m-67-93 27-28h80l27 28V99H-67Z");
    ctx.fillStyle="#955a3a"; ctx.beginPath(); ctx.arc(0,-102,5.5,0,Math.PI*2); ctx.fill();
    ctx.lineWidth=2; ctx.stroke(fio);
    ctx.fillStyle="#202020"; grupo(ctx,-38,-23,.99,()=>simbolo(ctx));
  });
}
function estudos(ctx) {
  ctx.fillStyle = "#faf8f1"; ctx.fillRect(0,0,480,150); ctx.fillStyle = "#202020";
  propostas.forEach((itens,i)=>grupo(ctx,[39,185,348][i], [37,41,36][i],1,()=>{
    for (const item of itens) {
      const traco = new Path2D(item);
      if (i === 1) {ctx.strokeStyle="#202020"; ctx.lineWidth=3.6; ctx.lineJoin="round"; ctx.stroke(traco);}
      else ctx.fill(traco);
    }
  }));
}
function desenhar(tela, formato, cor, largura) {
  const [w,h] = quadros[formato];
  tela.width=largura; tela.height=Math.round(largura*h/w);
  const ctx=tela.getContext("2d"); ctx.scale(tela.width/w,tela.height/h); ctx.fillStyle=cor;
  switch (formato) {
    case "logo": horizontal(ctx); break;
    case "wordmark": grupo(ctx,1,0,1,()=>escrever(ctx)); break;
    case "monogram": grupo(ctx,-4,-2,1,()=>simbolo(ctx)); break;
    case "compact": grupo(ctx,78,-1,1,()=>simbolo(ctx)); grupo(ctx,3,81,229/larguraNome,()=>escrever(ctx)); break;
    case "favicon": case "apple-touch-icon":
      ctx.fillStyle="#202020"; ctx.beginPath();
      if (formato === "favicon") ctx.roundRect(0,0,80,80,14); else ctx.rect(0,0,80,80);
      ctx.fill(); ctx.fillStyle="#faf8f1"; grupo(ctx,4.5,8.5,.91,()=>simbolo(ctx)); break;
    case "aplicacoes": amostras(ctx); break;
    case "exploracoes": estudos(ctx); break;
  }
}
</script>
<script>
const modelo=document.getElementById("modelo"), cor=document.getElementById("cor"), largura=document.getElementById("largura");
const tela=document.getElementById("tela"), fundo=document.getElementById("fundo"), controles=document.getElementById("controles");
function atualizar() {
  if (!largura.validity.valid) return;
  desenhar(tela,modelo.value,cor.value,Number(largura.value));
  fundo.classList.toggle("escuro",cor.value==="#ffffff");
}
controles.addEventListener("input",atualizar);
controles.addEventListener("submit",evento=>{
  evento.preventDefault(); atualizar();
  tela.toBlob(blob=>{const url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download="felipe-modas-"+modelo.value+"-"+largura.value+".png"; a.click(); setTimeout(()=>URL.revokeObjectURL(url),3000);},"image/png");
}); atualizar();
</script></body></html>
